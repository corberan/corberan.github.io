<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEBASM VM</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
        }

        /* 加载遮罩层 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading-progress {
            color: #aaa;
            font-size: 14px;
        }

        .progress-bar-container {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .main-content {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .left-panel {
            flex: 1;
            min-width: 300px;
        }

        .right-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 控制面板样式 */
        #control-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .control-group input[type="text"],
        .control-group input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .control-group input[type="text"]:focus,
        .control-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: background 0.3s;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
        }

        .control-group button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .control-group button:active {
            transform: translateY(0);
        }

        .control-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Canvas容器 */
        #canvas-container {
            background: #000;
            border-radius: 10px;
            overflow: visible;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 320px;
            position: relative;
        }

        /* 关键修改：保证Canvas像素清晰 */
        #canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor; /* for IE */
        }

        /* 缩放控制 */
        #zoom-control {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #zoom-control label {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }

        #zoom-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        #zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        #zoom-value {
            font-weight: 600;
            color: #667eea;
            min-width: 45px;
            text-align: right;
        }

        /* 虚拟键盘样式 */
        #keyboard-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .keyboard-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .keyboard-tab {
            flex: 1;
            padding: 10px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
        }

        .keyboard-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .keyboard {
            display: none;
        }

        .keyboard.active {
            display: block;
        }

        .keyboard-row {
            display: flex;
            gap: 4px; /* 关键修改：减小按键间距 */
            margin-bottom: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .key {
            min-width: 36px; /* 关键修改：减小最小宽度 */
            height: 38px; /* 关键修改：减小高度 */
            padding: 0 8px; /* 关键修改：减小内边距 */
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 13px; /* 关键修改：减小字体 */
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            flex-shrink: 0;
        }

        .key:hover {
            background: #f0f0f0;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .key:active {
            background: #667eea;
            color: white;
            transform: translateY(0) scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .key.wide {
            min-width: 76px;
        }

        .key.wider {
            min-width: 116px;
        }
        
        /* 方向键菱形布局 */
        .arrow-keyboard-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .diamond-keys {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }

        .arrow-key {
            width: 50px;
            height: 50px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .arrow-key:hover {
            background: #f0f0f0;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .arrow-key:active {
            background: #667eea;
            color: white;
            transform: translateY(0) scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .key-up { grid-column: 2; grid-row: 1; }
        .key-left { grid-column: 1; grid-row: 2; }
        .key-down { grid-column: 2; grid-row: 3; }
        .key-right { grid-column: 3; grid-row: 2; }

        .side-key {
            width: 70px;
            height: 50px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .side-key:hover {
            background: #f0f0f0;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .side-key:active {
            background: #667eea;
            color: white;
            transform: translateY(0) scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 控制台输出 */
        .console-container {
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
        }

        .console-header {
            background: #e9ecef;
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .console-header:hover {
            background: #dee2e6;
        }

        .console-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .console-toggle {
            font-size: 12px;
            color: #666;
        }

        #output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
        }

        #output.expanded {
            display: block;
        }

        #output::-webkit-scrollbar {
            width: 8px;
        }

        #output::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }

        #output::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }

            .left-panel, .right-panel {
                min-width: 100%;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            #control-panel {
                padding: 15px;
            }

            .key {
                min-width: 35px;
                height: 35px;
                font-size: 12px;
            }

            .arrow-key {
                width: 45px;
                height: 45px;
            }

            .diamond-keys {
                grid-template-columns: repeat(3, 45px);
                grid-template-rows: repeat(3, 45px);
            }
        }
    </style>
</head>
<body>

    <script type='text/javascript'>
        var loadingOverlay = document.getElementById('loading-overlay');
        var loadingText = document.getElementById('loading-text');
        var loadingProgress = document.getElementById('loading-progress');
        var progressBar = document.getElementById('progress-bar');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.textContent = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                        element.textContent += text + "\n";
                        element.scrollTop = element.scrollHeight;
                    }
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                
                if (m) {
                    text = m[1];
                    var current = parseInt(m[2]) * 100;
                    var total = parseInt(m[4]) * 100;
                    var percent = Math.round((current / total) * 100);
                    
                    loadingText.textContent = text;
                    loadingProgress.textContent = percent + '% (' + m[2] + '/' + m[4] + ')';
                    progressBar.style.width = percent + '%';
                } else {
                    loadingText.textContent = text;
                    if (text === '') {
                        setTimeout(function() {
                            loadingOverlay.classList.add('hidden');
                        }, 500);
                    }
                }
                
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                console.log("Status: " + text);
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            },
            onRuntimeInitialized: function() {
                console.log('✅ Module runtime initialized');
                Module.setStatus('');
            }
        };

        Module.setStatus('Downloading...');
        
        window.onerror = function(msg, url, line) {
            console.error('Error: ' + msg + ' at ' + url + ':' + line);
            loadingText.textContent = 'Error occurred';
            loadingProgress.textContent = 'Check console for details';
        };
    </script>
    <script async type="text/javascript" src="index.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('canvas');
            const canvasContainer = document.getElementById('canvas-container');
            const zoomSlider = document.getElementById('zoom-slider');
            const zoomValue = document.getElementById('zoom-value');

            // Canvas缩放功能
            zoomSlider.addEventListener('input', function() {
                const scale = this.value / 100;
                canvas.style.transform = `scale(${scale})`;
                canvas.style.transformOrigin = 'center center';
                zoomValue.textContent = this.value + '%';
                if (canvas.height) {
                    const scaledHeight = canvas.height * scale;
                    canvasContainer.style.minHeight = scaledHeight + 'px';
                }
            });

            // 控制台展开/收起
            const consoleHeader = document.getElementById('console-header');
            const consoleOutput = document.getElementById('output');
            const consoleToggle = consoleHeader.querySelector('.console-toggle');
            consoleHeader.addEventListener('click', function() {
                consoleOutput.classList.toggle('expanded');
                consoleToggle.textContent = consoleOutput.classList.contains('expanded') ? '▲ Click to collapse' : '▼ Click to expand';
            });

            // 键盘切换功能
            const keyboardTabs = document.querySelectorAll('.keyboard-tab');
            const keyboards = document.querySelectorAll('.keyboard');
            keyboardTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    keyboardTabs.forEach(t => t.classList.remove('active'));
                    keyboards.forEach(k => k.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.keyboard + '-keyboard').classList.add('active');
                });
            });

            // --- 关键修改：键盘事件处理核心 ---

            const keyCodeMap = { 'Escape': 27, 'Enter': 13, 'Backspace': 8, 'ArrowUp': 38, 'ArrowDown': 40, 'ArrowLeft': 37, 'ArrowRight': 39, ' ': 32, ',': 188, '.': 190 };
            
            // 关键新增：data-key到event.code的映射，确保全键盘工作正常
            const keyToCodeMap = {
                'Escape': 'Escape', 'Enter': 'Enter', 'Backspace': 'Backspace', 'ArrowUp': 'ArrowUp', 'ArrowDown': 'ArrowDown', 'ArrowLeft': 'ArrowLeft', 'ArrowRight': 'ArrowRight', ' ': 'Space', ',': 'Comma', '.': 'Period',
                '1': 'Digit1', '2': 'Digit2', '3': 'Digit3', '4': 'Digit4', '5': 'Digit5', '6': 'Digit6', '7': 'Digit7', '8': 'Digit8', '9': 'Digit9', '0': 'Digit0',
                'a': 'KeyA', 'b': 'KeyB', 'c': 'KeyC', 'd': 'KeyD', 'e': 'KeyE', 'f': 'KeyF', 'g': 'KeyG', 'h': 'KeyH', 'i': 'KeyI', 'j': 'KeyJ', 'k': 'KeyK', 'l': 'KeyL', 'm': 'KeyM', 'n': 'KeyN', 'o': 'KeyO', 'p': 'KeyP', 'q': 'KeyQ', 'r': 'KeyR', 's': 'KeyS', 't': 'KeyT', 'u': 'KeyU', 'v': 'KeyV', 'w': 'KeyW', 'x': 'KeyX', 'y': 'KeyY', 'z': 'KeyZ'
            };

            // 统一的按键事件模拟函数
            function simulateKeyEvent(type, key) {
                let keyCode = keyCodeMap[key] || (key.length === 1 ? key.toUpperCase().charCodeAt(0) : 0);
                let code = keyToCodeMap[key] || key;
                
                const event = new KeyboardEvent(type, {
                    key: key,
                    code: code,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true
                });
                
                // 将事件派发到 canvas，因为 Emscripten/SDL 主要监听它
                canvas.dispatchEvent(event);
            }

            // --- 物理键盘处理 ---
            document.addEventListener('keydown', function(event) {
                const activeElement = document.activeElement;
                if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
                    return; // 在输入框中，不拦截按键
                }
                
                // 只处理我们映射表中有的键，或常见的控制键
                const key = event.key;
                if (keyToCodeMap[key.toLowerCase()] || keyToCodeMap[key]) {
                    event.preventDefault();
                    if (!event.repeat) {
                        simulateKeyEvent('keydown', key);
                        console.log(`Physical KeyDown: ${key}`);
                    }
                }
            });

            document.addEventListener('keyup', function(event) {
                const activeElement = document.activeElement;
                if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
                    return;
                }
                
                const key = event.key;
                if (keyToCodeMap[key.toLowerCase()] || keyToCodeMap[key]) {
                    event.preventDefault();
                    simulateKeyEvent('keyup', key);
                    console.log(`Physical KeyUp: ${key}`);
                }
            });


            // --- 虚拟键盘处理 ---
            let currentPressedKey = null;
            let pressInterval = null;
            let pressTimeout = null;

            function handlePress(element) {
                const keyValue = element.dataset.key;
                if (!keyValue) return;

                // 立即触发一次 keydown
                simulateKeyEvent('keydown', keyValue);
                console.log('Virtual KeyDown:', keyValue);
                
                // 添加视觉反馈
                element.style.background = '#667eea';
                element.style.color = 'white';
                
                currentPressedKey = { key: keyValue, element: element };
                
                // 仅对方向键启用长按重复
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(keyValue)) {
                    pressTimeout = setTimeout(() => {
                        pressInterval = setInterval(() => {
                            if (currentPressedKey && currentPressedKey.key === keyValue) {
                                simulateKeyEvent('keydown', keyValue);
                            }
                        }, 100);
                    }, 400);
                }
            }

            function handleRelease(element) {
                if (!currentPressedKey || currentPressedKey.element !== element) return;

                const keyValue = currentPressedKey.key;
                simulateKeyEvent('keyup', keyValue);
                console.log('Virtual KeyUp:', keyValue);
                
                clearTimeout(pressTimeout);
                clearInterval(pressInterval);
                pressTimeout = null;
                pressInterval = null;
                
                element.style.background = '';
                element.style.color = '';
                
                currentPressedKey = null;
            }

            document.querySelectorAll('.key, .arrow-key, .side-key').forEach(keyElement => {
                // 鼠标事件
                keyElement.addEventListener('mousedown', (e) => { e.preventDefault(); handlePress(keyElement); });
                keyElement.addEventListener('mouseup', (e) => { e.preventDefault(); handleRelease(keyElement); });
                keyElement.addEventListener('mouseleave', (e) => { e.preventDefault(); handleRelease(keyElement); });
                // 触摸事件
                keyElement.addEventListener('touchstart', (e) => { e.preventDefault(); handlePress(keyElement); });
                keyElement.addEventListener('touchend', (e) => { e.preventDefault(); handleRelease(keyElement); });
                keyElement.addEventListener('touchcancel', (e) => { e.preventDefault(); handleRelease(keyElement); });
            });

            // 全局释放，防止按键卡住
            document.addEventListener('mouseup', () => { if (currentPressedKey) handleRelease(currentPressedKey.element); });

            // --- 控制面板功能 ---
            const loadBinButton = document.getElementById('load-bin-button');
            loadBinButton.addEventListener('click', function() {
                if (!Module.ccall) {
                    alert('Module is still loading, please wait...');
                    return;
                }

                const binPath = document.getElementById('bin-path').value.trim();
                const modelType = document.getElementById('model-type').value.trim();
                const width = parseInt(document.getElementById('screen-width').value) || 240;
                const height = parseInt(document.getElementById('screen-height').value) || 320;
                
                if (!binPath) {
                    alert('Please enter a bin file path');
                    return;
                }
                
                this.disabled = true;
                this.textContent = 'Loading...';
                
                setTimeout(() => {
                    try {
                        const result = Module.ccall('load_and_run_bin', 'number', ['string', 'number', 'number', 'string'], [binPath, width, height, modelType || '']);
                        if (result === 0) {
                            Module.print(`✅ Successfully loaded: ${binPath}\n📐 Screen size: ${width}x${height}`);
                            const scale = zoomSlider.value / 100;
                            canvasContainer.style.minHeight = (height * scale) + 'px';
                        } else {
                            Module.print(`❌ Failed to load: ${binPath} (code: ${result})`);
                            alert('Failed to load bin file. Check console for details.');
                        }
                    } catch (error) {
                        Module.print('❌ Error: ' + error);
                        alert('Error: ' + error);
                    }
                    
                    loadBinButton.disabled = false;
                    loadBinButton.textContent = 'Load and Run Bin File';
                }, 100);
            });

             // 更新速度显示
            const speedSlider = document.getElementById('speed-slider');
            speedSlider.addEventListener('input', function() {
                const speed = this.value;
                document.getElementById('speed-value').textContent = speed + ' Hz';
                if (Module._set_vm_clock_speed) {
                    Module._set_vm_clock_speed(parseInt(speed));
                }
            });
        });
    </script>
</body>
</html>
